name: Apply full source reconstruction

on:
  push:
    branches:
      - "feature/schematic-create-parity-ui"
    paths:
      - "reconstruction/full-source-bundle.b64"
      - ".github/workflows/apply-reconstruction.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feature/schematic-create-parity-ui
          fetch-depth: 0

      - name: Expand editable source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f reconstruction/full-source-bundle.b64
          base64 -d reconstruction/full-source-bundle.b64 > /tmp/quantum-tools-source.tar.gz
          tar -xzf /tmp/quantum-tools-source.tar.gz -C .
          rm -f src/main/java/mcjty/rftoolsbuilder/QuantumToolsMod.java
          rm -f reconstruction/full-source-bundle.b64
          rm -f .github/workflows/apply-reconstruction.yml

      - name: Verify source tree before commit
        shell: bash
        run: |
          set -euo pipefail
          test -f src/main/java/mcjty/rftoolsbuilder/RFToolsBuilder.java
          test -f src/main/java/mcjty/rftoolsbuilder/BuilderBlockEntity.java
          test -f src/main/java/mcjty/rftoolsbuilder/QuarryCardItem.java
          test -f src/main/java/mcjty/rftoolsbuilder/client/BuilderScreen.java
          test -f src/main/java/mcjty/rftoolsbuilder/client/QuarryFilterScreen.java
          test -f src/main/resources/assets/rftoolsbuilder/blockstates/builder.json
          test -f src/main/resources/data/rftoolsbuilder/recipe/builder.json
          test ! -f src/main/java/mcjty/rftoolsbuilder/QuantumToolsMod.java

      - name: Commit reconstructed editable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruct complete Builder and Quarry source"
          git push origin HEAD:feature/schematic-create-parity-ui
