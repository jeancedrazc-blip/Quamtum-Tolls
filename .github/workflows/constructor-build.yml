name: Constructor foundation build

on:
  push:
    branches: [ "agent/constructor-foundation" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate approved assets and references
        run: python3 scripts/validate_assets.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile constructor patch
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: constructor-patch
          path: build/libs/*.jar
