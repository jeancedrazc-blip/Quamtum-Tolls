name: Reconstruct Quantum Tools source

on:
  push:
    branches:
      - source/3.0.6-dev.9-placement-editor
    paths:
      - 'reconstruction/jar-parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore approved V5 JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reconstruction/work
          cat reconstruction/jar-parts/part-*.txt | base64 -d > reconstruction/work/QuantumTools-3.0.6-dev.8-v5.jar
          echo "08953788826bcbc2bb2edd92176a992ee579381cb106a714949c1dcbf1934b63  reconstruction/work/QuantumTools-3.0.6-dev.8-v5.jar" | sha256sum -c -
      - name: Download Vineflower
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar -o reconstruction/work/vineflower.jar
      - name: Reconstruct Java
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reconstruction/work/decompiled src/main/java
          mkdir -p reconstruction/work/decompiled src/main/java
          java -jar reconstruction/work/vineflower.jar --folder --skip-extra-files=1 --decompile-inner=1 --decompile-generics=1 --remove-synthetic=0 --sourcefile-comments=1 reconstruction/work/QuantumTools-3.0.6-dev.8-v5.jar reconstruction/work/decompiled
          cp -a reconstruction/work/decompiled/mcjty src/main/java/
      - name: Restore exact resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reconstruction/work/extracted src/main/resources
          mkdir -p reconstruction/work/extracted src/main/resources
          unzip -q reconstruction/work/QuantumTools-3.0.6-dev.8-v5.jar -d reconstruction/work/extracted
          find reconstruction/work/extracted -type f -name '*.class' -delete
          rm -f reconstruction/work/extracted/META-INF/MANIFEST.MF
          cp -a reconstruction/work/extracted/. src/main/resources/
      - name: Record provenance
        shell: bash
        run: |
          cat > reconstruction/README.md <<'EOF'
          # Quantum Tools source reconstruction
          The editable source was reconstructed from the user-approved Constructor V5 build with Vineflower 1.12.0.
          V5 SHA-256: `08953788826bcbc2bb2edd92176a992ee579381cb106a714949c1dcbf1934b63`.
          From this commit onward, `src/main/java` and `src/main/resources` are the development base.
          EOF
      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reconstruction/work
          git config user.name "Quantum Tools Source Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- src/main/java src/main/resources reconstruction/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconstruct complete 3.0.6-dev.8 V5 source"
          git push origin HEAD:source/3.0.6-dev.9-placement-editor
