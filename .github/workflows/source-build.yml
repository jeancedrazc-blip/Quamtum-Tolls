name: Quantum Tools source build

on:
  push:
    branches:
      - "source/3.0.6-dev.9-placement-editor-v5sync"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile Quantum Tools
        run: gradle build --stacktrace

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: quantum-tools-3.0.6-dev.9
          path: build/libs/*.jar
          if-no-files-found: error
