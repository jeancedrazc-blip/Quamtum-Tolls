name: Quantum Tools source build

on:
  push:
    branches:
      - "source/3.0.6-dev.9-placement-editor"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile Quantum Tools source
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quantum-tools-dev9-placement-editor
          path: build/libs/*.jar
