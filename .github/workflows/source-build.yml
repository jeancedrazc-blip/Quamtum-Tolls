name: Quantum Tools source build

on:
  push:
    branches:
      - "source/3.0.6-dev.10-vanilla-constructor"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build complete mod from source
        shell: bash
        run: gradle build --stacktrace

      - name: Upload Quantum Tools dev.10
        uses: actions/upload-artifact@v4
        with:
          name: quantum-tools-dev10-vanilla-constructor
          path: build/libs/*.jar
          if-no-files-found: error
